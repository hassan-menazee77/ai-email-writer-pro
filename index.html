<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Writer Pro - Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-dark);
        }

        .brand-icon {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid #c7d2fe;
        }

        /* Main Workspace */
        .workspace {
            max-width: 1320px;
            width: 100%;
            margin: 28px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 24px;
            flex: 1;
        }

        .panel {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
            padding: 28px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-dark);
        }

        /* API Box */
        .api-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 22px;
        }

        .api-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .api-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .api-links a:hover {
            text-decoration: underline;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-dark);
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .key-wrapper {
            position: relative;
        }

        .key-wrapper input {
            padding-right: 42px;
        }

        .toggle-key {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1rem;
        }

        textarea {
            min-height: 135px;
            resize: vertical;
            line-height: 1.5;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            margin-top: auto;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* Output Panel */
        .output-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: var(--text-dark);
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sm:hover {
            background: #e2e8f0;
        }

        .btn-copy {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .btn-copy:hover {
            background: #059669;
        }

        .email-canvas {
            flex: 1;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-muted);
            max-width: 280px;
        }

        .empty-state span {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
        }

        .email-text {
            white-space: pre-wrap;
            line-height: 1.75;
            font-size: 0.98rem;
            color: #1e293b;
            direction: auto;
            display: none;
        }

        .email-text.active {
            display: block;
        }

        .error-banner {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 14px;
            display: none;
        }

        .error-banner.active {
            display: block;
        }

        /* Loader */
        .loader {
            display: none;
            margin: auto;
            text-align: center;
            color: var(--text-muted);
        }

        .loader.active {
            display: block;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 960px) {
            .workspace {
                grid-template-columns: 1fr;
            }
            .email-canvas {
                min-height: 300px;
            }
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .navbar {
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <div class="brand-icon">✉️</div>
            <span>AI Email Writer Pro</span>
        </div>
        <span class="badge">v2.0 • Gemini • Claude • GPT</span>
    </nav>

    <main class="workspace">
        <!-- Left Panel: Controls -->
        <section class="panel">
            <div class="panel-title">
                <span>⚙️ Email Configuration</span>
            </div>

            <div class="api-box">
                <div class="api-header">
                    <span>API PROVIDER & KEY</span>
                    <span class="api-links">
                        Get key: <a href="https://aistudio.google.com/apikey" target="_blank">Gemini</a> • 
                        <a href="https://console.anthropic.com/" target="_blank">Claude</a> • 
                        <a href="https://platform.openai.com/api-keys" target="_blank">OpenAI</a>
                    </span>
                </div>
                <div class="grid-2">
                    <div class="form-group" style="margin-bottom:0;">
                        <select id="apiProvider" onchange="loadSavedKey()">
                            <option value="gemini">Google Gemini (2.5 Flash)</option>
                            <option value="anthropic">Anthropic (Claude 3.5)</option>
                            <option value="openai">OpenAI (GPT-4o-mini)</option>
                        </select>
                    </div>
                    <div class="key-wrapper">
                        <input type="password" id="apiKey" placeholder="Paste API Key..." oninput="saveKey()">
                        <button type="button" class="toggle-key" onclick="toggleKeyVisibility()" title="Show/Hide Key">👁️</button>
                    </div>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="emailType">Email Purpose</label>
                    <select id="emailType">
                        <option value="sales">💼 Sales Pitch</option>
                        <option value="cold">❄️ Cold Outreach</option>
                        <option value="followup">🔄 Follow-up</option>
                        <option value="meeting">📅 Meeting Request</option>
                        <option value="support">🎧 Customer Support</option>
                        <option value="introduction">👋 Introduction</option>
                        <option value="thank">🙏 Thank You</option>
                        <option value="apology">🤝 Apology</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tone">Tone of Voice</label>
                    <select id="tone">
                        <option value="professional">Professional</option>
                        <option value="persuasive">Persuasive</option>
                        <option value="friendly">Friendly</option>
                        <option value="formal">Formal</option>
                        <option value="casual">Casual</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="recipient">Recipient Name</label>
                    <input type="text" id="recipient" placeholder="e.g., Sarah Jenkins">
                </div>

                <div class="form-group">
                    <label for="language">Output Language</label>
                    <select id="language">
                        <option value="English">English</option>
                        <option value="Arabic">Arabic (العربية)</option>
                        <option value="French">French</option>
                        <option value="German">German</option>
                        <option value="Spanish">Spanish</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="subject">Subject Line (Optional)</label>
                <input type="text" id="subject" placeholder="Leave blank to let AI generate a high-converting subject">
            </div>

            <div class="form-group">
                <label for="context">Key Points & Context</label>
                <textarea id="context" placeholder="What is this email about?&#10;• Following up on yesterday's demo&#10;• Highlight 20% discount valid until Friday&#10;• Ask for a 15-minute call"></textarea>
            </div>

            <button class="btn-primary" id="generateBtn" onclick="generateEmail()">
                <span>✨ Generate Email</span>
            </button>

            <div class="error-banner" id="error"></div>
        </section>

        <!-- Right Panel: Live Preview -->
        <section class="panel">
            <div class="panel-title">
                <span>📄 Generated Preview</span>
                <div class="output-actions" id="actionButtons" style="display: none;">
                    <a id="mailtoBtn" href="#" class="btn-sm" target="_blank">↗ Open in Mail</a>
                    <button class="btn-sm btn-copy" onclick="copyEmail(this)">📋 Copy</button>
                </div>
            </div>

            <div class="email-canvas">
                <div class="empty-state" id="emptyState">
                    <span>✍️</span>
                    <p>Fill in your email details on the left and click <strong>Generate Email</strong> to see the result here.</p>
                </div>

                <div class="loader" id="loading">
                    <div class="spinner"></div>
                    <p>Crafting your email...</p>
                </div>

                <div class="email-text" id="emailOutput"></div>
            </div>
        </section>
    </main>

    <script>
        window.onload = loadSavedKey;

        function saveKey() {
            const provider = document.getElementById('apiProvider').value;
            const key = document.getElementById('apiKey').value;
            localStorage.setItem(`email_writer_key_${provider}`, key);
        }

        function loadSavedKey() {
            const provider = document.getElementById('apiProvider').value;
            document.getElementById('apiKey').value = localStorage.getItem(`email_writer_key_${provider}`) || '';
        }

        function toggleKeyVisibility() {
            const input = document.getElementById('apiKey');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function generateEmail() {
            const apiProvider = document.getElementById('apiProvider').value;
            const apiKey = document.getElementById('apiKey').value.trim();
            const emailType = document.getElementById('emailType').value;
            const recipient = document.getElementById('recipient').value.trim();
            const language = document.getElementById('language').value;
            const subject = document.getElementById('subject').value.trim();
            const context = document.getElementById('context').value.trim();
            const tone = document.getElementById('tone').value;

            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');
            const emailOutput = document.getElementById('emailOutput');
            const actionButtons = document.getElementById('actionButtons');
            const generateBtn = document.getElementById('generateBtn');

            errorDiv.classList.remove('active');

            if (!apiKey) {
                errorDiv.textContent = '⚠️ Please enter your API key first.';
                errorDiv.classList.add('active');
                return;
            }

            if (!context) {
                errorDiv.textContent = '⚠️ Please describe the key points for your email.';
                errorDiv.classList.add('active');
                return;
            }

            emptyState.style.display = 'none';
            emailOutput.classList.remove('active');
            actionButtons.style.display = 'none';
            loadingDiv.classList.add('active');
            generateBtn.disabled = true;

            const prompt = `Write a ${tone} ${emailType} email in ${language}.
Recipient: ${recipient || '[Recipient Name]'}
${subject ? `Subject: ${subject}` : 'Generate a compelling subject line.'}

Key Points & Context:
${context}

Rules:
- Output ONLY the email (Subject line followed by the body).
- Do NOT use markdown symbols like ** or ##.
- Keep it clear, natural, and ready to send.

Format:
Subject: [Subject Line]

[Email Body]`;

            try {
                let emailText = '';

                if (apiProvider === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
                    emailText = data.candidates[0].content.parts[0].text;

                } else if (apiProvider === 'anthropic') {
                    const res = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey,
                            'anthropic-version': '2023-06-01',
                            'anthropic-dangerous-direct-browser-access': 'true'
                        },
                        body: JSON.stringify({
                            model: 'claude-3-5-sonnet-20241022',
                            max_tokens: 1500,
                            messages: [{ role: 'user', content: prompt }]
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
                    emailText = data.content[0].text;

                } else {
                    const res = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-4o-mini',
                            messages: [{ role: 'user', content: prompt }],
                            max_tokens: 1500
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
                    emailText = data.choices[0].message.content;
                }

                const cleanText = emailText.trim();
                emailOutput.textContent = cleanText;
                emailOutput.classList.add('active');
                actionButtons.style.display = 'flex';
                updateMailtoLink(cleanText);

            } catch (err) {
                errorDiv.textContent = `❌ Error: ${err.message}`;
                errorDiv.classList.add('active');
                emptyState.style.display = 'block';
            } finally {
                loadingDiv.classList.remove('active');
                generateBtn.disabled = false;
            }
        }

        function updateMailtoLink(fullText) {
            const lines = fullText.split('\n');
            let subjectLine = '';
            let bodyText = fullText;

            if (lines[0].toLowerCase().startsWith('subject:')) {
                subjectLine = lines[0].replace(/^subject:\s*/i, '').trim();
                bodyText = lines.slice(1).join('\n').trim();
            }

            const mailtoUrl = `mailto:?subject=${encodeURIComponent(subjectLine)}&body=${encodeURIComponent(bodyText)}`;
            document.getElementById('mailtoBtn').href = mailtoUrl;
        }

        function copyEmail(btn) {
            const text = document.getElementById('emailOutput').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => btn.textContent = original, 2000);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) generateEmail();
        });
    </script>
</body>
</html>
